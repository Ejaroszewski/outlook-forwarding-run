name: Outlook Forwarding Run
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Start index (0-999)'
        default: '0'
      limit:
        description: 'Number of accounts to process'
        default: '1000'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install playwright scrapeless cryptography python-dotenv
          playwright install chromium --with-deps
      - name: Decrypt accounts
        run: |
          python3 -c "
          from cryptography.fernet import Fernet
          import os
          key = os.environ['ACCOUNTS_KEY'].encode()
          f = Fernet(key)
          data = f.decrypt(open('accounts.csv.enc','rb').read())
          open('accounts.csv','wb').write(data)
          print('decrypted', len(data), 'bytes')
          "
        env:
          ACCOUNTS_KEY: ${{ secrets.ACCOUNTS_KEY }}
      - name: Run forwarding
        run: |
          python3 forward.py --start ${{ inputs.start }} --limit ${{ inputs.limit }}
        env:
          SCRAPELESS_KEY: ${{ secrets.SCRAPELESS_KEY }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
      - name: Upload progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress-${{ inputs.start }}
          path: progress.json
