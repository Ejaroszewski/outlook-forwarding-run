name: Outlook Forwarding Verify
on:
  workflow_dispatch:
    inputs:
      indices:
        description: 'Comma-separated account indices to inspect (read-only)'
        required: true
        default: '0'
      token:
        description: 'Optional test token to search for in Inbox/Junk'
        required: false
        default: ''
      accounts_file:
        description: 'Encrypted accounts file'
        required: true
        default: 'accounts2.csv.enc'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install playwright cryptography
          playwright install chromium firefox --with-deps
      - name: Decrypt accounts
        run: |
          python3 -c "
          from cryptography.fernet import Fernet
          import os
          key = os.environ['ACCOUNTS_KEY'].encode()
          f = Fernet(key)
          data = f.decrypt(open('${{ inputs.accounts_file }}','rb').read())
          open('accounts.csv','wb').write(data)
          print('decrypted', len(data), 'bytes')
          "
        env:
          ACCOUNTS_KEY: ${{ secrets.ACCOUNTS_KEY }}
      - name: Run verification (read-only)
        run: |
          python3 verify.py --indices "${{ inputs.indices }}" --token "${{ inputs.token }}"
      - name: Upload verify results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          path: verify.json
