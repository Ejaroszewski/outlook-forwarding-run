name: E2E OTP Reader Proof
on:
  workflow_dispatch:
    inputs:
      accounts_file:
        description: 'Encrypted accounts file'
        required: true
        default: 'accounts3.csv.enc'
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install cryptography
      - name: Decrypt accounts
        run: |
          python3 -c "
          from cryptography.fernet import Fernet
          import os
          key = os.environ['ACCOUNTS_KEY'].encode()
          f = Fernet(key)
          data = f.decrypt(open('${{ inputs.accounts_file }}','rb').read())
          open('accounts.csv','wb').write(data)
          print('decrypted', len(data), 'bytes')
          "
        env:
          ACCOUNTS_KEY: ${{ secrets.ACCOUNTS_KEY }}
      - name: Run E2E proof
        run: python3 e2etest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2etest-results
          path: e2etest.json
